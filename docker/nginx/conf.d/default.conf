server {
    listen 443 ssl;
    #listen 80;
    root /var/www/public;
    server_name delivery-note-processor.local;
    index index.php index.html;

    client_max_body_size 100M;

    gzip on; # enable gzip
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

    error_log /var/log/nginx/delivery-note-processor.local-error.log;
    access_log /var/log/nginx/delivery-note-processor.local-access.log;

    ssl_certificate /etc/nginx/certs/delivery-note-processor.local.pem;
    ssl_certificate_key /etc/nginx/certs/delivery-note-processor.local-key.pem;

    add_header Content-Security-Policy "frame-ancestors 'self'";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass delivery_note_processor_app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
 }
