[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:delivery-note-watcher]
process_name=%(program_name)s
command=/usr/local/bin/watch-delivery.sh
user=www-data
directory=/var/www
autostart=true
autorestart=true
startsecs=1
stderr_logfile=/var/www/storage/logs/watch-error.log
stdout_logfile=/var/www/storage/logs/watch.log

[program:horizon]
process_name=%(program_name)s
command=/usr/local/bin/php /var/www/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/horizon.log
