[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:delivery-note-watcher]
process_name=%(program_name)s
; Invoke through bash so a missing exec bit on the mounted script cannot cause a
; supervisor "spawn error"; logs go to /var/log/supervisor which always exists.
command=/bin/bash /usr/local/bin/watch-delivery.sh
user=www-data
directory=/var/www/delivery-note-processor
autostart=true
autorestart=true
startsecs=1
stderr_logfile=/var/www/delivery-note-processor/storage/logs/watch-error.log
stdout_logfile=/var/www/delivery-note-processor/storage/logs/watch.log

[program:horizon]
process_name=%(program_name)s
command=/usr/bin/php /var/www/delivery-note-processor/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/delivery-note-processor/storage/logs/horizon.log
